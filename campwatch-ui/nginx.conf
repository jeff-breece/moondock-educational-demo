server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Allow photo uploads up to the API's 20 MB limit (+ multipart overhead).
    client_max_body_size 25m;

    # Proxy API calls to the campwatch-api container so the browser can use
    # same-origin relative URLs (no CORS, no hard-coded lab IP). Without this
    # the SPA fallback below returns index.html for /api/* and every data call
    # silently fails (broken search / photo upload / data wiring).
    location /api/ {
        proxy_pass http://campwatch-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
